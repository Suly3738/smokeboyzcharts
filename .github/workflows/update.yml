name: Aktualizacja notowania

on:
  schedule:
    - cron: "0 5 * * *" # codziennie 05:00 UTC (07:00 czasu polskiego latem, 06:00 zimą)
  workflow_dispatch:
  push:
    branches: [main]

env:
  TZ: Europe/Warsaw

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pixacharts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pobierz dane i wygeneruj stronę
        run: node update.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}

      - name: Zapisz historię notowań w repozytorium
        run: |
          git config user.name "pixacharts-bot"
          git config user.email "pixacharts-bot@users.noreply.github.com"
          git add data.json history.json index.html shorts-cache.json
          git diff --cached --quiet || git commit -m "Notowanie $(date +%Y-%m-%d)"
          git push

      - name: Przygotuj pliki strony
        run: |
          mkdir -p _site
          cp index.html data.json version.json logo.png _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
